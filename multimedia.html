<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Tags</title>
</head>
<body>
    <h1>Media Tags in HTML</h1>
    <h2>Image</h2>
    <img src="https://thumbs.dreamstime.com/b/leopard-climbing-tree-tropical-forest-wildlife-photography-natural-habitat-close-up-animal-behavior-striking-showcases-its-368786597.jpg?w=992" alt="Leopard" width="500" height="300">
    <p>This is an image using the &lt;img&gt; tag.</p>
    <h2>Audio</h2>
    <audio controls>
        <source src="audio.ogg" type="audio/ogg">
        Your browser does not support the audio element.
    </audio>
    <p>This is an audio player using the <code>&lt;audio&gt;</code> tag.</p>
    <h2>Video</h2>
    <video width="320" height="240" controls>
        <source src="sample.mp4" type="video/mp4">
        Your browser does not support the video element.
    </video>
    <p>This is a video player using the <code>&lt;video&gt;</code> tag.</p>
    <h2>Embedded Video (IFrame)</h2>
    <iframe width="400" height ="250" src ="https://www.youtube.com/embed/HcOc7P5BMi4" title="HTML Tutorial" frameborder="0" allowfullscreen></iframe>
    <p>This uses <code>&lt;iframe&gt;</code> to embed a YouTube video.</p>
</body>
</html>
